<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14261d"/>
      <stop offset="100%" stop-color="#0a140f"/>
    </linearGradient>
    <linearGradient id="sageLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sunbeamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Shell Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Ambient Inner Border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#254636" stroke-width="3" opacity="0.6"/>

  <!-- Orbital Rings of Balance & Low-Spoons Grace -->
  <circle cx="256" cy="266" r="148" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.7"/>
  <circle cx="256" cy="266" r="190" fill="none" stroke="#1c382b" stroke-width="2" opacity="0.4"/>

  <!-- Glowing Sun / Focus Dawn behind the sprout -->
  <circle cx="256" cy="180" r="54" fill="url(#sunbeamGrad)" filter="url(#softGlow)" opacity="0.85"/>
  <circle cx="256" cy="180" r="38" fill="#ffffff" opacity="0.35"/>

  <!-- Base Zen Pebble (Grounded Routine) -->
  <ellipse cx="256" cy="380" rx="120" ry="38" fill="#143023" opacity="0.7"/>
  <ellipse cx="256" cy="374" rx="112" ry="34" fill="#1f4232"/>
  <ellipse cx="256" cy="368" rx="90" ry="22" fill="#2d5743" opacity="0.5"/>

  <!-- Sprout Stem (Organic Growth) -->
  <path d="M 256 360 C 256 300 256 240 256 210" stroke="url(#sageLeafGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Left Calming Leaf (Brain Dump / Mind Clarity) -->
  <path d="M 256 290 C 210 270 170 300 180 326 C 200 350 250 318 256 290 Z" fill="url(#sageLeafGrad)" filter="url(#softGlow)" opacity="0.95"/>
  
  <!-- Right Dopamine Leaf (Vitality & Energy) -->
  <path d="M 256 246 C 304 220 344 248 334 276 C 314 304 262 272 256 246 Z" fill="url(#sageLeafGrad)" filter="url(#softGlow)" opacity="0.95"/>

  <!-- Top Sprout Bud -->
  <circle cx="256" cy="204" r="10" fill="#a7f3d0"/>

  <!-- Micro Sparkles (Dopamine Cues) -->
  <circle cx="164" cy="184" r="3.5" fill="#fef08a" opacity="0.75"/>
  <circle cx="348" cy="164" r="4.5" fill="#6ee7b7" opacity="0.8"/>
  <circle cx="298" cy="120" r="2.5" fill="#fef08a" opacity="0.6"/>
</svg>