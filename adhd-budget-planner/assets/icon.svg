<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a24"/>
      <stop offset="100%" stop-color="#0f1915"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle ambient inner glow ring -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#2d4a3e" stroke-width="3" opacity="0.6"/>

  <!-- Visual Concept: Calm Equilibrium / Stacking Balance (ADHD financial harmony) -->
  <!-- Base Stone (Solid Foundation / Checking & Safety) -->
  <ellipse cx="256" cy="342" rx="140" ry="46" fill="#1e3e32" opacity="0.5"/>
  <ellipse cx="256" cy="336" rx="136" ry="44" fill="url(#emeraldGrad)" filter="url(#softGlow)" opacity="0.95"/>
  <ellipse cx="256" cy="330" rx="120" ry="32" fill="#5eead4" opacity="0.3"/>

  <!-- Middle Stone (Planned Runway & Sinking Funds) -->
  <ellipse cx="256" cy="248" rx="104" ry="36" fill="#134e4a" opacity="0.6"/>
  <ellipse cx="256" cy="242" rx="100" ry="34" fill="#2dd4bf"/>
  <ellipse cx="256" cy="236" rx="86" ry="24" fill="#99f6e4" opacity="0.45"/>

  <!-- Top Keystone / Focus Star (The "Safe to Spend" clarity) -->
  <ellipse cx="256" cy="164" rx="66" ry="26" fill="#0f766e" opacity="0.6"/>
  <ellipse cx="256" cy="160" rx="64" ry="24" fill="url(#goldGrad)"/>
  <circle cx="256" cy="158" r="8" fill="#ffffff" opacity="0.9"/>

  <!-- Ambient Light Sparks -->
  <circle cx="160" cy="140" r="3" fill="#5eead4" opacity="0.4"/>
  <circle cx="350" cy="190" r="4" fill="#fde047" opacity="0.4"/>
</svg>
